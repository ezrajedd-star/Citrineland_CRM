name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citrineland
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citrineland
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BOOTSTRAP_ADMIN_EMAIL: admin@citrineland.test
      BOOTSTRAP_ADMIN_PASSWORD: CI-Password-123!
      DEMO_PASSWORD_LOGIN: "true"
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy && npm run db:seed
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm start & npm run worker & npx wait-on http://localhost:3000/api/health && BASE_URL=http://localhost:3000 npm run test:e2e
