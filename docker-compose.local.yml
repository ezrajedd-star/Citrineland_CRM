# Run Citrineland CRM on your own computer with Docker Desktop — no .env needed.
#   docker compose -f docker-compose.local.yml up --build
# Then open http://localhost:3000  (admin@citrineland.test / ChangeMe!2026)
# Stop: Ctrl+C.  Wipe all data: docker compose -f docker-compose.local.yml down -v
# Demo/dev only: fixed secrets below must never be used in production.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: citrineland
      POSTGRES_PASSWORD: citrineland
      POSTGRES_DB: citrineland
    volumes:
      - localdb:/var/lib/postgresql/data
    ports:
      - "5433:5432" # optional: inspect with any Postgres client on localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citrineland"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    command: ["sh", "scripts/start-web.sh"]
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://citrineland:citrineland@db:5432/citrineland
      APP_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: local-dev-only-secret-change-me-0123456789
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      BOOTSTRAP_ADMIN_EMAIL: admin@citrineland.test
      BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!2026}
      DEMO_PASSWORD_LOGIN: "true"
      SEED_ON_START: "true"
      SEED_DEMO: "true"
      RUN_WORKER_IN_WEB: "true"
      STORAGE_DRIVER: database
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  localdb:
